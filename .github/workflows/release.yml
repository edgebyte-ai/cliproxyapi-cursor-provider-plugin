name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test and build
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          go test ./...
          go test -race ./...
          go vet ./...
          make build VERSION="$version"
          mkdir -p dist
          touch -d @0 build/plugins/linux/amd64/cliproxyapi-cursor-provider.so
          (cd build/plugins/linux/amd64 && zip -X -9 -j ../../../../dist/cliproxyapi-cursor-provider_${version}_linux_amd64.zip cliproxyapi-cursor-provider.so)
          (cd dist && sha256sum cliproxyapi-cursor-provider_${version}_linux_amd64.zip > checksums.txt)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" dist/cliproxyapi-cursor-provider_*_linux_amd64.zip dist/checksums.txt \
            --title "$GITHUB_REF_NAME" --generate-notes
