services:
  cliproxyapi:
    image: eceasy/cli-proxy-api:v7.2.141
    container_name: cursor-provider-plugin-test
    restart: unless-stopped
    environment:
      TZ: UTC
    ports:
      - "127.0.0.1:18317:8317"
    volumes:
      - ./.runtime/test/config.yaml:/CLIProxyAPI/config.yaml:ro
      - ./build/plugins:/CLIProxyAPI/plugins:ro
      - ./.runtime/test/auths:/root/.cli-proxy-api
      - ./.runtime/test/logs:/CLIProxyAPI/logs
