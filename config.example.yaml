plugins:
  enabled: true
  dir: "plugins"
  configs:
    cliproxyapi-cursor-provider:
      enabled: true
      priority: 100
      provider_id: "cursor"
      model_prefix: ""
      model_mode: "normalized"
      default_reasoning_effort: "high"
      model_display_names:
        cursor-grok-4.5: "Grok 4.5"
        cursor-grok-4.6: "Grok 4.6"
      cursor_base_url: "https://api2.cursor.sh"
      client_version: "cli-2026.10.16-e3cb207"
      allowed_native_tools: ["mcp_tool_call", "get_mcp_tools_tool_call"]
      request_timeout_seconds: 300
      transient_retry_count: 1
      transient_retry_delay_ms: 250
      model_cache_ttl_seconds: 600
